<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Refeições - Santuário Tabor Fonte de Vida Nova</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <div id="formContainer">
      <div class="text-center mb-6">
        <h1 class="text-xl font-bold text-slate-800">Santuário Tabor Fonte de Vida Nova</h1>
        <p class="text-sm text-slate-500">Reserva de Refeições - 18/10/2026</p>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Nome Completo</label>
          <input type="text" id="nome" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">WhatsApp (com DDD)</label>
          <input type="tel" id="whatsapp" required placeholder="35912345678" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Cidade</label>
          <input type="text" id="cidade" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <hr class="my-4 border-slate-200">

        <h2 class="text-lg font-semibold text-slate-800 mb-2">Escolha suas Refeições</h2>

        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg">
          <div>
            <p class="font-medium text-slate-800">Combo (Café + Almoço)</p>
            <p class="text-xs text-slate-500">R$ 55,00 cada</p>
          </div>
          <div class="flex items-center space-x-2">
            <button type="button" onclick="changeQty('combo', -1)" class="w-8 h-8 rounded-full bg-slate-200 font-bold text-slate-700">-</button>
            <span id="qty-combo" class="w-6 text-center font-medium">0</span>
            <button type="button" onclick="changeQty('combo', 1)" class="w-8 h-8 rounded-full bg-amber-500 text-white font-bold">+</button>
          </div>
        </div>

        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg">
          <div>
            <p class="font-medium text-slate-800">Café Avulso</p>
            <p class="text-xs text-slate-500">R$ 20,00 cada</p>
          </div>
          <div class="flex items-center space-x-2">
            <button type="button" onclick="changeQty('cafe', -1)" class="w-8 h-8 rounded-full bg-slate-200 font-bold text-slate-700">-</button>
            <span id="qty-cafe" class="w-6 text-center font-medium">0</span>
            <button type="button" onclick="changeQty('cafe', 1)" class="w-8 h-8 rounded-full bg-amber-500 text-white font-bold">+</button>
          </div>
        </div>

        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg">
          <div>
            <p class="font-medium text-slate-800">Almoço Avulso</p>
            <p class="text-xs text-slate-500">R$ 40,00 cada</p>
          </div>
          <div class="flex items-center space-x-2">
            <button type="button" onclick="changeQty('almoco', -1)" class="w-8 h-8 rounded-full bg-slate-200 font-bold text-slate-700">-</button>
            <span id="qty-almoco" class="w-6 text-center font-medium">0</span>
            <button type="button" onclick="changeQty('almoco', 1)" class="w-8 h-8 rounded-full bg-amber-500 text-white font-bold">+</button>
          </div>
        </div>

        <div class="bg-amber-50 p-4 rounded-lg flex justify-between items-center mt-4">
          <span class="font-bold text-amber-900">Valor Total:</span>
          <span id="totalDisplay" class="text-xl font-bold text-amber-600">R$ 0,00</span>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-4">
          Finalizar Reserva
        </button>
      </form>
    </div>
  </div>

  <script>
    const N8N_WEBHOOK_URL = 'https://diversity-real-carriers-geographic.trycloudflare.com/webhook/reserva-refeicao';
    const SEU_NUMERO_WHATSAPP = '5535910192823';

    const PRECOS = { combo: 55, cafe: 20, almoco: 40 };
    const items = { combo: 0, cafe: 0, almoco: 0 };

    function changeQty(item, delta) {
      items[item] = Math.max(0, items[item] + delta);
      document.getElementById(`qty-${item}`).innerText = items[item];
      updateTotal();
    }

    function updateTotal() {
      const total = (items.combo * PRECOS.combo) + (items.cafe * PRECOS.cafe) + (items.almoco * PRECOS.almoco);
      document.getElementById('totalDisplay').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    async function submitOrder(e) {
      e.preventDefault();
      
      const totalValue = (items.combo * PRECOS.combo) + (items.cafe * PRECOS.cafe) + (items.almoco * PRECOS.almoco);

      if (totalValue === 0) {
        alert("Por favor, selecione ao menos um item para continuar.");
        return;
      }

      const rawPhone = document.getElementById('whatsapp').value.replace(/\D/g, "");

      const payload = {
        origem: 'website',
        nome: document.getElementById('nome').value,
        whatsapp: rawPhone,
        cidade: document.getElementById('cidade').value,
        data_evento: '18/10/2026',
        reserva: {
          combo: items.combo,
          cafe: items.cafe,
          almocos: items.almoco
        },
        valor_total: totalValue
      };

      const btn = document.getElementById('submitBtn');
      btn.innerText = "Registrando reserva...";
      btn.disabled = true;

      try {
        await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const whatsappUrl = `https://wa.me/${SEU_NUMERO_WHATSAPP}`;

        document.getElementById('formContainer').innerHTML = `
          <div class="text-center py-6 space-y-4">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
            <h2 class="text-2xl font-bold text-slate-800">Reserva Registrada!</h2>
            <p class="text-slate-600 text-sm">Acesse o WhatsApp para realizar o pagamento via PIX e enviar o comprovante.</p>
            <a href="${whatsappUrl}" class="inline-block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-200 text-center">
              💬 Ver instruções de pagamento no WhatsApp
            </a>
          </div>
        `;
      } catch (err) {
        console.error("Erro ao enviar webhook:", err);
        alert("Houve um erro ao registrar sua reserva. Por favor, tente novamente.");
        btn.innerText = "Finalizar Reserva";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
